<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ATIVAVID</title>
  <meta name="description" content="Entre na sua conta ATIVAVID.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/icon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-900.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/source-sans-3.woff2" crossorigin>
  <link rel="stylesheet" href="/admin.css?v=20261012c">
</head>
<body class="adm">
<div class="adm-fundo" aria-hidden="true"></div>

<main id="telaEntrar" class="adm-entrar">
  <form id="formEntrar" class="adm-vidro adm-cartao" autocomplete="on">
    <img class="adm-logo-entrar" src="/assets/logo.png" alt="ATIVAVID" width="280" height="89">
    <p class="adm-sub">Área do cliente</p>
    <label class="adm-campo">
      <span>E-mail</span>
      <input id="email" type="email" name="email" autocomplete="username" required inputmode="email" autocapitalize="off" spellcheck="false" placeholder="voce@ativavid.com">
    </label>
    <label class="adm-campo">
      <span>Senha</span>
      <input id="senha" type="password" name="password" autocomplete="current-password" required placeholder="Sua senha">
    </label>
    <button id="btEntrar" class="adm-bt adm-bt-forte adm-bt-cheio" type="submit">Entrar</button>
    <button id="btEsqueci" class="adm-link" type="button">Esqueci minha senha</button>
    <p id="erroEntrar" class="adm-aviso" role="alert" hidden></p>
    <p class="adm-rodape">A mesma conta que você usa no ATIVAVID do computador e do iPhone.</p>
  </form>

  <form id="formTrocar" class="adm-vidro adm-cartao" autocomplete="off" hidden>
    <img class="adm-logo-entrar" src="/assets/logo.png" alt="ATIVAVID" width="280" height="89">
    <p class="adm-sub">Trocar a senha</p>
    <div id="passoPedir">
      <label class="adm-campo">
        <span>E-mail da sua conta</span>
        <input id="emailTrocar" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="voce@ativavid.com">
      </label>
      <button id="btPedirCodigo" class="adm-bt adm-bt-forte adm-bt-cheio" type="button">Mandar o código</button>
    </div>
    <div id="passoCodigo" hidden>
      <label class="adm-campo">
        <span>Código que chegou no e-mail</span>
        <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" placeholder="000000">
      </label>
      <label class="adm-campo">
        <span>Senha nova</span>
        <input id="senhaNova" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
      </label>
      <button id="btTrocar" class="adm-bt adm-bt-forte adm-bt-cheio" type="button">Trocar a senha e entrar</button>
      <button id="btReenviar" class="adm-link" type="button">Mandar o código de novo</button>
    </div>
    <p id="avisoTrocar" class="adm-aviso" role="alert" hidden></p>
    <button id="btVoltar" class="adm-link" type="button">Voltar para a entrada</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="/login.js?v=20261012b"></script>
</body>
</html>
