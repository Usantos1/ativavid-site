<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel admin — ATIVAVID</title>
  <meta name="description" content="Painel admin do ATIVAVID: assinaturas e computadores dos clientes.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/icon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-900.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/source-sans-3.woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=20261006b">
  <link rel="stylesheet" href="/admin.css?v=20261010d">
</head>
<body class="adm">

<!-- Entrar. É a única coisa visível enquanto o servidor não confirmar quem é.
     Mesma conta do aplicativo: o Windows, o Mac e o iPhone entram por aqui. -->
<main id="telaEntrar" class="adm-entrar">

  <form id="formEntrar" class="adm-cartao" autocomplete="on">
    <h1 class="adm-marca">ATIVAVID</h1>
    <p class="adm-sub">Painel admin</p>
    <label class="adm-campo">
      <span>E-mail</span>
      <input id="email" type="email" name="email" autocomplete="username" required
             inputmode="email" autocapitalize="off" spellcheck="false" placeholder="voce@ativavid.com">
    </label>
    <label class="adm-campo">
      <span>Senha</span>
      <input id="senha" type="password" name="password" autocomplete="current-password" required
             placeholder="Sua senha">
    </label>
    <button id="btEntrar" class="adm-bt adm-bt-forte" type="submit">Entrar</button>
    <button id="btEsqueci" class="adm-link" type="button">Esqueci minha senha</button>
    <p id="erroEntrar" class="adm-aviso" role="alert" hidden></p>
    <p class="adm-rodape">A mesma conta que você usa no ATIVAVID do computador e do iPhone.</p>
  </form>

  <!-- Trocar a senha: o MESMO caminho do app (código no e-mail, senha nova
       aqui) — /auth/v1/recover e depois verify com type=recovery. -->
  <form id="formTrocar" class="adm-cartao" autocomplete="off" hidden>
    <h1 class="adm-marca">ATIVAVID</h1>
    <p class="adm-sub">Trocar a senha</p>

    <div id="passoPedir">
      <label class="adm-campo">
        <span>E-mail da sua conta</span>
        <input id="emailTrocar" type="email" autocomplete="username" inputmode="email"
               autocapitalize="off" spellcheck="false" placeholder="voce@ativavid.com">
      </label>
      <button id="btPedirCodigo" class="adm-bt adm-bt-forte" type="button">Mandar o código</button>
    </div>

    <div id="passoCodigo" hidden>
      <label class="adm-campo">
        <span>Código que chegou no e-mail</span>
        <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="10" placeholder="000000">
      </label>
      <label class="adm-campo">
        <span>Senha nova</span>
        <input id="senhaNova" type="password" autocomplete="new-password"
               placeholder="mínimo 6 caracteres">
      </label>
      <button id="btTrocar" class="adm-bt adm-bt-forte" type="button">Trocar a senha e entrar</button>
      <button id="btReenviar" class="adm-link" type="button">Mandar o código de novo</button>
    </div>

    <p id="avisoTrocar" class="adm-aviso" role="alert" hidden></p>
    <button id="btVoltar" class="adm-link" type="button">Voltar para a entrada</button>
  </form>

</main>

<!-- O painel nasce escondido. Quem o mostra é a resposta do servidor, nunca o
     navegador: privilégio lido de cache local é palpite, não fato. -->
<div id="painel" hidden>
  <header class="adm-topo">
    <div>
      <strong class="adm-marca-pq">ATIVAVID</strong>
      <span id="quem" class="adm-quem"></span>
    </div>
    <button id="btSair" class="adm-bt adm-bt-fraco" type="button">Sair</button>
  </header>

  <nav class="adm-abas" role="tablist">
    <button class="adm-aba is-on" type="button" role="tab" data-aba="assinaturas" aria-selected="true">Assinaturas</button>
    <button class="adm-aba" type="button" role="tab" data-aba="computadores" aria-selected="false">Computadores</button>
  </nav>

  <div class="adm-busca">
    <input id="busca" type="search" placeholder="Filtrar por e-mail…" autocapitalize="off" spellcheck="false">
    <button id="btRecarregar" class="adm-bt adm-bt-fraco" type="button" title="Recarregar">Recarregar</button>
  </div>

  <p id="recado" class="adm-recado" role="status" hidden></p>

  <!-- ASSINATURAS: a unidade que se cobra -->
  <section id="abaAssinaturas" class="adm-aba-conteudo">
    <details class="adm-novo">
      <summary>Criar cliente e liberar</summary>
      <div class="adm-novo-corpo">
        <label class="adm-campo">
          <span>E-mail do cliente</span>
          <input id="novoEmail" type="email" inputmode="email" autocapitalize="off"
                 spellcheck="false" placeholder="cliente@email.com">
        </label>
        <label class="adm-campo">
          <span>Senha provisória</span>
          <input id="novaSenha" type="text" autocomplete="off" placeholder="mínimo 6 caracteres">
          <small>O cliente entra com ela e troca depois em “Esqueci minha senha”.</small>
        </label>
        <label class="adm-campo">
          <span>Dias de acesso</span>
          <input id="novoDias" type="number" value="365" min="1" max="3650" inputmode="numeric">
        </label>
        <button id="btCriar" class="adm-bt adm-bt-forte" type="button">Criar e liberar</button>
      </div>
    </details>
    <div id="listaAssinaturas" class="adm-lista" aria-live="polite"></div>
  </section>

  <!-- COMPUTADORES: a unidade que se bloqueia -->
  <section id="abaComputadores" class="adm-aba-conteudo" hidden>
    <div id="listaComputadores" class="adm-lista" aria-live="polite"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="/admin.js?v=20261010d"></script>
</body>
</html>
